[project]
name = "judgelab-python-practice"
version = "0.1.0"
description = "Hands-on Python/FastAPI/asyncio interview practice"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "uvicorn>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
