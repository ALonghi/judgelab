app = "judgelab-alonghi"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  JUDGELAB_PUBLIC_ORIGIN = "https://judgelab-alonghi.fly.dev"

[[mounts]]
  source = "judgelab_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
