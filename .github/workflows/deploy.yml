name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep the single stateful instance's deployments sequential.
concurrency:
  group: fly-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests_app
      - run: node --test tests_ui/*.test.cjs

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: '0.4.102'
      - name: Deploy the single production Machine
        run: flyctl deploy --remote-only --ha=false --app judgelab-alonghi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
